<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320" role="img" aria-label="Clinical Ambulatory Glucose Profile time-series chart showing glycemic excursion above 140 mg/dL care plan limit">
  <defs>
    <!-- Dynamic color-coded gradient for the CGM curve: Green in target -> Red above 140 limit -->
    <linearGradient id="glucoseCurveGrad" x1="0" y1="260" x2="0" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="60%" stop-color="#10b981"/>
      <stop offset="72%" stop-color="#f59e0b"/>
      <stop offset="78%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>

    <!-- Subtle area gradient under curve -->
    <linearGradient id="glucoseAreaGrad" x1="0" y1="60" x2="0" y2="260" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#e11d48" stop-opacity="0.14"/>
      <stop offset="35%" stop-color="#f59e0b" stop-opacity="0.08"/>
      <stop offset="65%" stop-color="#10b981" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Target Range Corridor Gradient -->
    <linearGradient id="targetCorridorGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.03"/>
    </linearGradient>

    <!-- Modern Drop Shadow for Tooltip -->
    <filter id="tooltipDrop" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Canvas Surface -->
  <rect width="900" height="320" fill="#ffffff" rx="8"/>

  <!-- Target Range Corridor (70 to 140 mg/dL: Y=120 to Y=242.5) -->
  <rect x="70" y="120" width="750" height="122.5" fill="url(#targetCorridorGrad)"/>

  <!-- Hyperglycemia Excursion Zone (Above 140 mg/dL: Y=45 to Y=120) -->
  <rect x="70" y="45" width="750" height="75" fill="#e11d48" fill-opacity="0.025"/>

  <!-- Horizontal Gridlines & Y-Axis Reference Ticks -->
  <g stroke="#eef2f6" stroke-width="1" stroke-dasharray="3 3">
    <line x1="70" y1="50" x2="820" y2="50"/>
    <line x1="70" y1="85" x2="820" y2="85"/>
    <line x1="70" y1="155" x2="820" y2="155"/>
    <line x1="70" y1="190" x2="820" y2="190"/>
    <line x1="70" y1="225" x2="820" y2="225"/>
    <line x1="70" y1="260" x2="820" y2="260"/>
  </g>

  <!-- Vertical Time Gridlines -->
  <g stroke="#f8fafc" stroke-width="1">
    <line x1="110" y1="45" x2="110" y2="260"/>
    <line x1="280" y1="45" x2="280" y2="260"/>
    <line x1="450" y1="45" x2="450" y2="260"/>
    <line x1="620" y1="45" x2="620" y2="260"/>
  </g>

  <!-- Care Plan Upper Threshold Line (140 mg/dL: Y=120) -->
  <line x1="70" y1="120" x2="820" y2="120" stroke="#e11d48" stroke-width="1.6" stroke-dasharray="5 4"/>

  <!-- Target Corridor Lower Boundary (70 mg/dL: Y=242.5) -->
  <line x1="70" y1="242.5" x2="820" y2="242.5" stroke="#10b981" stroke-width="1.2" stroke-dasharray="3 3" stroke-opacity="0.6"/>

  <!-- Y-Axis Value Labels (Left) -->
  <g fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" font-weight="500" text-anchor="end">
    <text x="60" y="54">180</text>
    <text x="60" y="89">160</text>
    <text x="60" y="124" fill="#e11d48" font-weight="700">140</text>
    <text x="60" y="159">120</text>
    <text x="60" y="194">100</text>
    <text x="60" y="229">80</text>
    <text x="60" y="264">60</text>
    <text x="60" y="32" fill="#94a3b8" font-size="9.5">mg/dL</text>
  </g>

  <!-- Right-aligned Target Corridor Markers -->
  <g>
    <rect x="826" y="111" width="66" height="18" rx="3" fill="#fff1f2" stroke="#fecdd3" stroke-width="1"/>
    <text x="859" y="123" text-anchor="middle" fill="#e11d48" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" font-weight="700">140 Limit</text>
    <text x="828" y="246" fill="#059669" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" font-weight="600">70 Low</text>
  </g>

  <!-- Area under the curve -->
  <path d="M110 204 C190 202, 230 196, 280 193.5 S390 174, 450 165.5 S560 135, 620 127 S720 82, 780 71 L780 260 L110 260 Z" fill="url(#glucoseAreaGrad)"/>

  <!-- Main CGM Curve Line (Color shifts smoothly across threshold) -->
  <path d="M110 204 C190 202, 230 196, 280 193.5 S390 174, 450 165.5 S560 135, 620 127 S720 82, 780 71" fill="none" stroke="url(#glucoseCurveGrad)" stroke-width="3" stroke-linecap="round"/>

  <!-- In-Range Sensor Readings (06:00 to 08:00) -->
  <g stroke-width="2">
    <circle cx="110" cy="204" r="3.5" fill="#ffffff" stroke="#10b981"/>
    <circle cx="280" cy="193.5" r="3.5" fill="#ffffff" stroke="#10b981"/>
    <circle cx="450" cy="165.5" r="3.5" fill="#ffffff" stroke="#10b981"/>
  </g>

  <!-- Transition Point near threshold (09:00, 136 mg/dL) -->
  <circle cx="620" cy="127" r="4" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>

  <!-- Vertical Telemetry Crosshair at Latest Reading (09:41) -->
  <line x1="780" y1="48" x2="780" y2="260" stroke="#e11d48" stroke-width="1.2" stroke-dasharray="3 3" stroke-opacity="0.4"/>

  <!-- Latest Hyperglycemia Excursion Point (168 mg/dL at 09:41) -->
  <circle cx="780" cy="71" r="10" fill="#e11d48" fill-opacity="0.18"/>
  <circle cx="780" cy="71" r="5" fill="#e11d48" stroke="#ffffff" stroke-width="2"/>

  <!-- Modern Clinical Tooltip Popover (Floating above 09:41 marker) -->
  <g filter="url(#tooltipDrop)">
    <rect x="715" y="16" width="130" height="42" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <polygon points="776,58 784,58 780,63" fill="#0f172a"/>
    <text x="726" y="32" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" font-weight="500">09:41 · HIGH LIMIT</text>
    <text x="726" y="49" fill="#ffffff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700">168 <tspan font-size="9.5" fill="#fda4af">mg/dL</tspan> <tspan font-size="9.5" fill="#f87171" font-weight="700">▲ +28</tspan></text>
  </g>

  <!-- X-Axis Labels (Time) -->
  <g fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="500" text-anchor="middle">
    <text x="110" y="284">06:00</text>
    <text x="280" y="284">07:00</text>
    <text x="450" y="284">08:00</text>
    <text x="620" y="284">09:00</text>
    <text x="780" y="284" fill="#e11d48" font-weight="700">09:41</text>
  </g>
</svg>
