<svg xmlns="http://www.w3.org/2000/svg" width="390" height="200" viewBox="0 0 390 200" role="img" aria-label="Mobile Ambulatory Glucose Profile time-series chart showing glycemic excursion above 140 mg/dL limit">
  <defs>
    <!-- Dynamic color-coded gradient for the CGM curve: Green in target -> Red above 140 limit -->
    <linearGradient id="glucoseCurveGradM" x1="0" y1="160" x2="0" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="60%" stop-color="#10b981"/>
      <stop offset="72%" stop-color="#f59e0b"/>
      <stop offset="80%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>

    <!-- Area gradient under curve -->
    <linearGradient id="glucoseAreaGradM" x1="0" y1="40" x2="0" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#e11d48" stop-opacity="0.14"/>
      <stop offset="40%" stop-color="#f59e0b" stop-opacity="0.08"/>
      <stop offset="70%" stop-color="#10b981" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.0"/>
    </linearGradient>
  </defs>

  <!-- Canvas Surface -->
  <rect width="390" height="200" fill="#ffffff" rx="6"/>

  <!-- Target Range Corridor (70 to 140 mg/dL: Y=80 to Y=155) -->
  <rect x="38" y="80" width="305" height="75" fill="#10b981" fill-opacity="0.05"/>
  <!-- Excursion Zone (Above 140 mg/dL: Y=25 to Y=80) -->
  <rect x="38" y="25" width="305" height="55" fill="#e11d48" fill-opacity="0.025"/>

  <!-- Gridlines -->
  <g stroke="#eef2f6" stroke-width="1" stroke-dasharray="2 2">
    <line x1="38" y1="35" x2="345" y2="35"/>
    <line x1="38" y1="58" x2="345" y2="58"/>
    <line x1="38" y1="105" x2="345" y2="105"/>
    <line x1="38" y1="130" x2="345" y2="130"/>
    <line x1="38" y1="155" x2="345" y2="155"/>
  </g>

  <!-- Care Plan Upper Threshold Line (140 mg/dL: Y=80) -->
  <line x1="38" y1="80" x2="345" y2="80" stroke="#e11d48" stroke-width="1.4" stroke-dasharray="4 3"/>
  <text x="348" y="83" fill="#e11d48" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8.5" font-weight="700">140</text>

  <!-- Y-Axis Labels -->
  <g fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" font-weight="500" text-anchor="end">
    <text x="32" y="38">180</text>
    <text x="32" y="61">160</text>
    <text x="32" y="83" fill="#e11d48" font-weight="700">140</text>
    <text x="32" y="108">120</text>
    <text x="32" y="133">100</text>
    <text x="32" y="158">80</text>
  </g>

  <!-- Area under curve -->
  <path d="M50 144 C88 142, 105 138, 120 136 S170 122, 190 115 S240 94, 260 88 S300 56, 320 48 L320 155 L50 155 Z" fill="url(#glucoseAreaGradM)"/>

  <!-- Curve line -->
  <path d="M50 144 C88 142, 105 138, 120 136 S170 122, 190 115 S240 94, 260 88 S300 56, 320 48" fill="none" stroke="url(#glucoseCurveGradM)" stroke-width="2.6" stroke-linecap="round"/>

  <!-- In-range points -->
  <circle cx="50" cy="144" r="2.8" fill="#ffffff" stroke="#10b981" stroke-width="1.6"/>
  <circle cx="120" cy="136" r="2.8" fill="#ffffff" stroke="#10b981" stroke-width="1.6"/>
  <circle cx="190" cy="115" r="2.8" fill="#ffffff" stroke="#10b981" stroke-width="1.6"/>
  <circle cx="260" cy="88" r="3" fill="#ffffff" stroke="#f59e0b" stroke-width="1.6"/>

  <!-- Crosshair line at 09:41 -->
  <line x1="320" y1="28" x2="320" y2="155" stroke="#e11d48" stroke-width="1" stroke-dasharray="2 2" stroke-opacity="0.5"/>

  <!-- Latest point & popover -->
  <circle cx="320" cy="48" r="7" fill="#e11d48" fill-opacity="0.2"/>
  <circle cx="320" cy="48" r="3.5" fill="#e11d48" stroke="#ffffff" stroke-width="1.5"/>

  <!-- Tooltip card -->
  <rect x="252" y="16" width="76" height="22" rx="4" fill="#0f172a"/>
  <polygon points="316,38 324,38 320,42" fill="#0f172a"/>
  <text x="290" y="31" text-anchor="middle" fill="#ffffff" font-family="ui-monospace, monospace" font-size="9" font-weight="700">168 <tspan font-size="7.5" fill="#fda4af">mg/dL</tspan></text>

  <!-- X-Axis Labels -->
  <g fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" font-weight="500" text-anchor="middle">
    <text x="50" y="178">06:00</text>
    <text x="120" y="178">07:00</text>
    <text x="190" y="178">08:00</text>
    <text x="260" y="178">09:00</text>
    <text x="320" y="178" fill="#e11d48" font-weight="700">09:41</text>
  </g>
</svg>
